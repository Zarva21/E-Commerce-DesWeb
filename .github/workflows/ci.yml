name: Backend API Testing CI

on:
  push:
    branches: [ "Produccion" ]
  pull_request:
    branches: [ "Produccion" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    # LA MAGIA PARA TU ESTRUCTURA:
    # Le dice a GitHub que ejecute todos los comandos dentro de la carpeta "backend"
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: qa_ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Obtener código (clona todo el repositorio)
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # A partir de aquí, gracias al working-directory, todos estos comandos 
    # asumen que ya estás dentro de la carpeta /backend/
    - name: Instalar dependencias
      run: npm ci

    - name: Construir esquema de Base de Datos
      run: node scripts/sync-db.js
      env:
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: qa_ecommerce
        DB_HOST: localhost

    - name: Verificar Servicios Externos
      run: node scripts/verify-services.js
      env:
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: qa_ecommerce
        DB_HOST: localhost
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    - name: Pruebas Unitarias y de Humo
      run: node --test test/api.smoke.test.js test/auth.service.test.js test/product-images.service.test.js
      env:
        JWT_SECRET: "test-secret"

    - name: Auditoría de Rutas
      run: node test/run-route-audit.js
      env:
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: qa_ecommerce
        DB_HOST: localhost
        RUN_ROUTE_AUDIT: "1"

    - name: Pruebas de Integración (Checkout)
      run: node scripts/run-integration-tests.js
      env:
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: qa_ecommerce
        DB_HOST: localhost
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        JWT_SECRET: "test-secret"
        RUN_INTEGRATION: "1"

    - name: Limpieza de Datos QA
      if: always()
      run: node scripts/cleanup-qa-data.js
      env:
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: qa_ecommerce
        DB_HOST: localhost